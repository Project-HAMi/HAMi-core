---
name: CodeQL

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze C
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      security-events: write
      actions: read
    # The build needs nvcc: test/CMakeLists.txt does find_package(CUDA REQUIRED)
    # and cuda_add_executable() for the .cu tests. Same image as build-in-docker.
    container:
      image: nvidia/cuda:13.3.0-cudnn-devel-ubi8@sha256:e5b2b971730b6d0defd6d1bd7697630e0e599c359190cc4351e3032134e7b401
    steps:
      - name: Install build dependencies
        run: dnf install -y cmake git tar gzip

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: c-cpp
          build-mode: manual

      - name: Build
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash ./build.sh

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4
        with:
          category: /language:c-cpp
