name: style

on:
  pull_request:

permissions:
  contents: read

jobs:
  cpplint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: reviewdog/action-cpplint@85949cd74d65e9f24a0410483991e50b7aefeb61 # v1.13.0
      with:
        github_token: ${{ secrets.github_token }}
        flags: --linelength=120 --extensions=h,hpp,c,cpp,cc,cu,hh,ipp
